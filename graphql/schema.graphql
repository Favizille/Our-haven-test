"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
type Query {
    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)
}

type Mutation {
  "Create a new meal."
  createMeal(input: CreateMealInput!): Meal
    @field(resolver: "App\\GraphQL\\Mutations\\MealResolver@create")

  "Login a User."
  login(email: String!, password: String!): AuthPayload
  @field(resolver: "App\\GraphQL\\Mutations\\Auth\\LoginResolver")
}

type User {
    id: ID!
    name: String!
    email: String!
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
    meals: [Meal!]! @hasMany
}

type Meal {
  id: ID!
  name: String!
  description: String
  price: Float!
  category_id: ID
  created_at: DateTime!
  updated_at: DateTime!
  user: User @belongsTo
}

input CreateMealInput {
  name: String! @rules(apply: ["required", "string", "max:255"])
  description: String @rules(apply: ["nullable", "string"])
  price: Float! @rules(apply: ["required", "numeric", "min:0"])
  user_id: ID @rules(apply: ["nullable", "exists:users,id"])
}


type AuthPayload {
  token: String!
  user: User!
}